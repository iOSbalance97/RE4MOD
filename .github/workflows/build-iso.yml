name: Verificar y publicar parche

# Aplica el parche indicado en patches/LATEST a los discos limpios (release V1)
# y publica las ISO resultantes en una release nueva con el nombre del parche.
on:
  push:
    paths:
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLEAN1: 9e58a28b32cbbddd215f2fcbecb79c41812f5f54
      CLEAN2: 5dc7461496040f6656ecd7e187ab9f54d05d58fd
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xdelta3
          gh release download v1.8.3 -R encounter/decomp-toolkit -p 'dtk-linux-x86_64' -O dtk
          chmod +x dtk

      - name: Discos limpios (release V1)
        run: |
          mkdir -p work
          gh release download V1 -R "$GITHUB_REPOSITORY" -D work -p '*Disc.1.rvz' -p '*Disc.2.rvz'
          ./dtk disc convert work/*Disc.1.rvz work/disc1.iso
          ./dtk disc convert work/*Disc.2.rvz work/disc2.iso
          rm work/*.rvz
          echo "$CLEAN1  work/disc1.iso" | sha1sum -c
          echo "$CLEAN2  work/disc2.iso" | sha1sum -c

      - name: Publicar ISO limpias (una sola vez)
        run: |
          if ! gh release view LIMPIA -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p clean
            cp work/disc1.iso clean/RE4_PAL_disc1_limpia.iso
            cp work/disc2.iso clean/RE4_PAL_disc2_limpia.iso
            gh release create LIMPIA --prerelease --target "$GITHUB_SHA" --title "ISO limpias (base de los parches)" \
              --notes "ISO PAL G4BP08 rev 0 sin modificar. SHA-1 disco 1: $CLEAN1 / disco 2: $CLEAN2. Los parches xdelta se aplican sobre estas." clean/*
            rm -rf clean
          fi

      - name: Aplicar parche
        run: |
          TAG=$(tr -d '[:space:]' < patches/LATEST)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p dist
          for n in disc1 disc2; do
            xdelta3 -d -s work/$n.iso patches/$TAG/$n.xdelta work/out.iso
            rm work/$n.iso
            want=$(awk -v n=$n '$1==n{print $2}' patches/$TAG/sha1.txt)
            echo "$want  work/out.iso" | sha1sum -c
            rm work/out.iso
          done
          cp patches/$TAG/G4BP08.ini dist/
          cp patches/$TAG/disc1.xdelta dist/RE4_PAL_disc1_$TAG.xdelta
          cp patches/$TAG/disc2.xdelta dist/RE4_PAL_disc2_$TAG.xdelta

      - name: Publicar
        run: |
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "patches/$TAG/NOTAS.md" dist/*
